schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
operations:
- module: "."
  gate: api
  steps:
  - type: make
    makefile: verification/package.mk
    target: api
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "./abac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./acl"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./policy"
    fuzz: '^FuzzDecode$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./rbac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
