schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/authorization.txt
operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^TestEngine(AllowsOnlyOneConcurrentSnapshotReplacement|ConcurrentDecisionsUseOneCoherentSnapshot)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "./abac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./acl"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./policy"
    fuzz: '^FuzzDecode$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./rbac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
